<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FlowScript — self test</title>
    <style>
      body { font: 13px ui-monospace, Menlo, monospace; padding: 20px; }
      .pass { color: #15803d; }
      .fail { color: #b91c1c; font-weight: 700; }
      h1 { font-size: 15px; }
    </style>
  </head>
  <body>
    <h1>FlowScript self test</h1>
    <p>Checks the pure logic that a save/load cycle depends on. Run with <code>npm run dev</code> and open <code>/selftest.html</code>.</p>
    <div id="out"></div>

    <script type="module">
      import {
        coerceSong, newSong, makeBar, allSlotRefs, slotKey, headerLine, NOTCH_LEVELS,
        beatSubdivisions, subCount, subAtFraction, parseDivision, COMPOUND_DIVISIONS,
        comparePos, normalizeRange, MIN_LYRIC_SIZE, MAX_LYRIC_SIZE, MIN_BEAT_WIDTH, MAX_BEAT_WIDTH, MIN_ROW_GAP, MAX_ROW_GAP,
        DEFAULT_ROW_GAP,
      } from '/src/model.ts'
      import { computeLayout, slotAtX, slotStartX, slotEndX, stripeBands } from '/src/layout.ts'
      import {
        normalizeHex, coercePalette, rhymeFill, phraseFill, swatchLabel, colorIndexForKey,
        COLOR_KEY_HINTS, DEFAULT_PALETTE, DEFAULT_HIGHLIGHTS, defaultPalette, PALETTE_SIZE, HIGHLIGHT_SIZE,
      } from '/src/palette.ts'

      const out = document.getElementById('out')
      let failures = 0

      function check(name, fn) {
        let ok = false
        let detail = ''
        try {
          const r = fn()
          ok = r === true
          if (!ok) detail = ' — ' + String(r)
        } catch (err) {
          detail = ' — threw: ' + err.message
        }
        if (!ok) failures++
        const div = document.createElement('div')
        div.className = ok ? 'pass' : 'fail'
        div.textContent = (ok ? '✓ ' : '✗ ') + name + detail
        out.appendChild(div)
      }

      // Key order is not part of the format, so normalise before comparing.
      const stable = (v) =>
        JSON.stringify(v, (_k, val) =>
          val && typeof val === 'object' && !Array.isArray(val)
            ? Object.fromEntries(Object.entries(val).sort(([a], [b]) => (a < b ? -1 : 1)))
            : val,
        )
      const eq = (a, b) => (stable(a) === stable(b) ? true : `${stable(a)}\n  !==\n  ${stable(b)}`)

      /* ---- round trip ---- */

      const song = newSong(3)
      song.header = { verse: 'Verse 2', title: 'Test Song', artist: 'Artist', year: '1992', timestamp: '1:04' }
      song.startBar = 9
      song.bars[0].divisions[2] = 3
      song.bars[0].divisions[3] = 8
      song.bars[0].slots[slotKey(0, 0)] = { text: 'I', circle: 'large', color: 1, tie: true }
      song.bars[0].slots[slotKey(1, 2)] = { text: 'got', circle: 'small', color: 1, color2: 5, tdx: -4, tdy: 6 }
      song.bars[1].divisions[3] = 8
      song.bars[1].slots[slotKey(3, 7)] = { text: 'y.', circle: 'large' }
      song.highlights.push({
        id: 'hl-1',
        color: 2,
        start: { bar: 0, beat: 2, sub: 1 },
        end: { bar: 2, beat: 1, sub: 2 },
      })

      const roundTripped = coerceSong(JSON.parse(JSON.stringify(song)))
      check('round trip preserves the whole document', () => eq(roundTripped, song))
      check('round trip is stable a second time', () => eq(coerceSong(JSON.parse(JSON.stringify(roundTripped))), song))

      /* ---- repair of damaged / partial files ---- */

      check('rejects non-songs', () => {
        try { coerceSong({ nope: 1 }); return 'did not throw' } catch { return true }
      })

      check('drops slots outside the bar length', () => {
        const bad = JSON.parse(JSON.stringify(song))
        bad.bars[0].slots['9:0'] = { text: 'nope' }
        bad.bars[0].slots['0:99'] = { text: 'nope' }
        const fixed = coerceSong(bad)
        return eq(Object.keys(fixed.bars[0].slots).sort(), ['0:0', '1:2'])
      })

      check('fills in a missing divisions array', () => {
        const bad = JSON.parse(JSON.stringify(song))
        delete bad.bars[1].divisions
        return eq(coerceSong(bad).bars[1].divisions, [4, 4, 4, 4])
      })

      check('clamps highlights to the bars that exist', () => {
        const bad = JSON.parse(JSON.stringify(song))
        bad.highlights[0].end.bar = 99
        return coerceSong(bad).highlights[0].end.bar === 2 ? true : 'not clamped'
      })

      check('clamps a highlight edge to the beat’s division', () => {
        const bad = JSON.parse(JSON.stringify(song))
        bad.highlights[0].start.sub = 99 // beat 2 of bar 0 is divided into 3
        return coerceSong(bad).highlights[0].start.sub === 2 ? true : 'not clamped'
      })

      // Highlights were beat-granular before subdivision ranges existed.
      check('migrates a beat-granular highlight to cover whole beats', () => {
        const old = JSON.parse(JSON.stringify(song))
        old.highlights = [{ id: 'old', color: 0, start: { bar: 0, beat: 0 }, end: { bar: 0, beat: 3 } }]
        const h = coerceSong(old).highlights[0]
        // bar 0 beat 3 is divided into 8, so the end expands to sub 7
        return eq([h.start, h.end], [{ bar: 0, beat: 0, sub: 0 }, { bar: 0, beat: 3, sub: 7 }])
      })

      /* ---- subdivision ranges ---- */

      check('comparePos orders bar, then beat, then sub', () => {
        const p = (bar, beat, sub) => ({ bar, beat, sub })
        return comparePos(p(0, 0, 1), p(0, 0, 2)) < 0 &&
          comparePos(p(0, 1, 0), p(0, 0, 3)) > 0 &&
          comparePos(p(1, 0, 0), p(0, 3, 3)) > 0 &&
          comparePos(p(2, 1, 1), p(2, 1, 1)) === 0
          ? true
          : 'wrong ordering'
      })

      check('normalizeRange swaps a backwards drag', () => {
        const a = { bar: 1, beat: 2, sub: 3 }
        const b = { bar: 1, beat: 0, sub: 1 }
        return eq(normalizeRange(a, b), { start: b, end: a })
      })

      check('a highlight can start and end mid-beat', () => {
        const s = newSong(1)
        const l = computeLayout(s, 1)
        const row = l.bars[0]
        // beat 0 divided into 4: from sub 1 to sub 3 spans three 16th cells
        const x = slotStartX(row, 0, 1)
        const x2 = slotEndX(row, 0, 3)
        const cell = l.m.pxPerBeat / 4
        return Math.abs(x - (row.x0 + cell)) < 0.001 && Math.abs(x2 - x - cell * 3) < 0.001
          ? true
          : `x=${x} x2=${x2} cell=${cell}`
      })

      check('a whole-beat range still lands on the beat edges', () => {
        const s = newSong(1)
        const l = computeLayout(s, 1)
        const row = l.bars[0]
        return Math.abs(slotStartX(row, 1, 0) - row.beatEdges[1]) < 0.001 &&
          Math.abs(slotEndX(row, 1, 3) - row.beatEdges[2]) < 0.001
          ? true
          : 'edges moved'
      })

      check('slotEndX never runs past the end of the bar', () => {
        const s = newSong(1)
        const l = computeLayout(s, 1)
        const row = l.bars[0]
        return slotEndX(row, 3, 3) <= row.x1 + 0.001 ? true : 'overran the bar'
      })

      check('slotAtX resolves the subdivision under the pointer', () => {
        const s = newSong(1)
        s.bars[0].divisions[0] = 3
        const l = computeLayout(s, 1)
        const row = l.bars[0]
        const cell = l.m.pxPerBeat / 3
        return eq(
          [
            slotAtX(row, row.x0 + 1),
            slotAtX(row, row.x0 + cell + 1),
            slotAtX(row, row.x0 + l.m.pxPerBeat + 1),
          ],
          [{ beat: 0, sub: 0 }, { beat: 0, sub: 1 }, { beat: 1, sub: 0 }],
        )
      })

      check('slotAtX clamps outside the bar', () => {
        const l = computeLayout(newSong(1), 1)
        const row = l.bars[0]
        return eq([slotAtX(row, -500), slotAtX(row, row.x1 + 500)], [
          { beat: 0, sub: 0 },
          { beat: 3, sub: 3 },
        ])
      })

      check('an edge on a vanished subdivision falls back inside the beat', () => {
        const s = newSong(1)
        s.bars[0].divisions[2] = 3
        const l = computeLayout(s, 1)
        const row = l.bars[0]
        // sub 3 no longer exists in a beat divided into 3
        return slotEndX(row, 2, 3) <= row.beatEdges[3] + 0.001 ? true : 'ran past the beat'
      })

      check('keeps startBar 0', () => coerceSong({ ...song, startBar: 0 }).startBar === 0 || 'lost zero')

      /* ---- color palettes ---- */

      check('custom colors survive a round trip', () => {
        const s = newSong(1)
        s.palette[1] = '#123456'
        s.highlightPalette[0] = '#ABCDEF'
        const back = coerceSong(JSON.parse(JSON.stringify(s)))
        return back.palette[1] === '#123456' && back.highlightPalette[0] === '#ABCDEF'
          ? true
          : `${back.palette[1]} / ${back.highlightPalette[0]}`
      })

      // Files written before palettes were editable carry no palette at all.
      check('a file with no palette falls back to the built-in colors', () => {
        const s = newSong(1)
        const raw = JSON.parse(JSON.stringify(s))
        delete raw.palette
        delete raw.highlightPalette
        const back = coerceSong(raw)
        return eq([back.palette, back.highlightPalette], [
          DEFAULT_PALETTE.map((c) => c.fill),
          DEFAULT_HIGHLIGHTS.map((c) => c.fill),
        ])
      })

      check('palette length is pinned so color indices stay valid', () => {
        const raw = { ...JSON.parse(JSON.stringify(newSong(1))), palette: ['#000000'] }
        const back = coerceSong(raw)
        return back.palette.length === PALETTE_SIZE &&
          back.highlightPalette.length === HIGHLIGHT_SIZE &&
          back.palette[0] === '#000000' &&
          back.palette[1] === DEFAULT_PALETTE[1].fill
          ? true
          : `len ${back.palette.length}`
      })

      check('garbage color values fall back per slot', () => {
        const raw = {
          ...JSON.parse(JSON.stringify(newSong(1))),
          palette: ['not-a-color', '#GGG', 42, '#abc'],
        }
        const back = coerceSong(raw)
        return back.palette[0] === DEFAULT_PALETTE[0].fill &&
          back.palette[1] === DEFAULT_PALETTE[1].fill &&
          back.palette[2] === DEFAULT_PALETTE[2].fill &&
          back.palette[3] === '#AABBCC'
          ? true
          : JSON.stringify(back.palette.slice(0, 4))
      })

      /* ---- palette contrast, for two-color circles ---- */

      // WCAG relative luminance / contrast ratio. A striped circle is only
      // readable as two rhymes if its two colors are far enough apart.
      const relLum = (hex) => {
        const h = hex.replace('#', '')
        const ch = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
        const f = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4))
        return 0.2126 * f(ch[0]) + 0.7152 * f(ch[1]) + 0.0722 * f(ch[2])
      }
      const contrast = (a, b) => {
        const [x, y] = [relLum(a), relLum(b)].sort((p, q) => q - p)
        return (x + 0.05) / (y + 0.05)
      }

      const DARK_MAX = 0.2
      const PAIR_MIN = 2.5

      check('the default scheme keeps four colors dark enough to stripe against', () => {
        const darks = DEFAULT_PALETTE.filter((s) => relLum(s.fill) < DARK_MAX)
        return darks.length >= 4 ? true : `only ${darks.length}: ${darks.map((s) => s.name)}`
      })

      // The whole point of the dark end: no light color may be left without
      // something it can be striped against.
      check('every light default color has a partner it contrasts with', () => {
        for (const s of DEFAULT_PALETTE) {
          if (relLum(s.fill) < DARK_MAX) continue
          const best = Math.max(
            ...DEFAULT_PALETTE.filter((o) => o.fill !== s.fill).map((o) => contrast(s.fill, o.fill)),
          )
          if (best < PAIR_MIN) return `${s.name} tops out at ${best.toFixed(2)}:1`
        }
        return true
      })

      /* ---- two-color circles ---- */

      check('a non-integer second color is dropped, the rest of the slot survives', () => {
        const bad = JSON.parse(JSON.stringify(song))
        bad.bars[0].slots['1:2'].color2 = 'blue'
        const slot = coerceSong(bad).bars[0].slots['1:2']
        return slot.color2 === undefined && slot.color === 1 && slot.text === 'got'
          ? true
          : JSON.stringify(slot)
      })

      check('a file written before second colors existed loads unchanged', () => {
        const old = JSON.parse(JSON.stringify(song))
        delete old.bars[0].slots['1:2'].color2
        return coerceSong(old).bars[0].slots['1:2'].color2 === undefined ? true : 'invented one'
      })

      check('an out-of-range second color index still renders something', () =>
        rhymeFill(defaultPalette(), 99) === DEFAULT_PALETTE[0].fill ? true : 'no fallback')

      // The Alt binding has to match on e.code, because macOS turns ⌥1 into "¡".
      check('every color key hint has a matching physical key', () => {
        const codes = [
          ['Backquote', false], ['Digit1', false], ['Digit2', false], ['Digit3', false],
          ['Digit4', false], ['Digit5', false], ['Digit6', false], ['Digit7', false],
          ['Digit8', false], ['Digit9', false], ['Digit0', false],
          ['Digit1', true], ['Digit2', true], ['Digit3', true], ['Digit4', true], ['Digit5', true],
        ]
        if (codes.length !== COLOR_KEY_HINTS.length) return 'hint list changed size'
        return eq(
          codes.map(([c, s]) => colorIndexForKey(c, 'ignored', s)),
          COLOR_KEY_HINTS.map((_, i) => i),
        )
      })

      check('an unbound key is not a color', () =>
        colorIndexForKey('KeyA', 'a', false) === -1 && colorIndexForKey('Digit0', '0', true) === -1
          ? true
          : 'matched something it should not')

      // Remote desktops and on-screen keyboards can leave e.code empty.
      check('a key event with no code falls back to the character', () =>
        colorIndexForKey('', '3', false) === 3 && colorIndexForKey('', '%', true) === 15
          ? true
          : 'no fallback')

      // The stripes are drawn as geometry, not an SVG <pattern>: the export path
      // renders a second <Score> into the same document, where two elements
      // sharing an id would make url(#…) resolve to whichever came first.
      check('stripe bands stay inside the circle', () => {
        for (const r of [11, 6.5, 3, 22]) {
          for (const d of stripeBands(r)) {
            const coords = d.match(/-?\d+(\.\d+)?/g).map(Number)
            // Every coordinate in the path is a point on or inside the disc.
            for (const v of coords) {
              if (Math.abs(v) > r + 0.01) return `r=${r} has a coordinate ${v}`
            }
          }
        }
        return true
      })

      check('stripe bands are symmetric about the centre and cover it', () => {
        const bands = stripeBands(11)
        if (bands.length % 2 !== 1) return `expected an odd count, got ${bands.length}`
        if (bands.length < 3) return `too few bands: ${bands.length}`
        // The middle band straddles x = 0, so a two-color circle never reads as
        // a solid one of either color.
        const xs = bands[(bands.length - 1) / 2].match(/M (-?\d+(\.\d+)?)/)
        return Number(xs[1]) < 0 ? true : `middle band starts at ${xs[1]}`
      })

      check('stripe count does not change with the circle size', () =>
        stripeBands(11).length === stripeBands(6.5).length
          ? true
          : `${stripeBands(11).length} vs ${stripeBands(6.5).length}`)

      check('normalizeHex accepts shorthand, bare and mixed case', () =>
        eq(
          ['#abc', 'abc', '#AaBbCc', 'FFF', '  #123456  '].map((v) => normalizeHex(v, '#000000')),
          ['#AABBCC', '#AABBCC', '#AABBCC', '#FFFFFF', '#123456'],
        ))

      check('normalizeHex rejects anything else', () =>
        eq(
          [null, undefined, '', '#12345', 'red', 'rgb(1,2,3)', '#1234567'].map((v) =>
            normalizeHex(v, '#ABCDEF'),
          ),
          Array(7).fill('#ABCDEF'),
        ))

      check('coercePalette never returns holes', () => {
        const p = coercePalette(undefined, DEFAULT_PALETTE)
        return p.length === PALETTE_SIZE && p.every((c) => /^#[0-9A-F]{6}$/.test(c))
          ? true
          : JSON.stringify(p)
      })

      check('fills read from the song palette, not the defaults', () => {
        const p = defaultPalette()
        p[2] = '#001122'
        return rhymeFill(p, 2) === '#001122' && rhymeFill(p, undefined) === p[0]
          ? true
          : rhymeFill(p, 2)
      })

      check('an out-of-range color index still renders something', () =>
        rhymeFill(defaultPalette(), 99) === DEFAULT_PALETTE[0].fill &&
        phraseFill(DEFAULT_HIGHLIGHTS.map((c) => c.fill), 99) === DEFAULT_HIGHLIGHTS[0].fill
          ? true
          : 'no fallback')

      check('swatch keeps its name until it is customised', () => {
        const p = defaultPalette()
        const named = swatchLabel(p, 1, DEFAULT_PALETTE)
        p[1] = '#101010'
        return named === DEFAULT_PALETTE[1].name && swatchLabel(p, 1, DEFAULT_PALETTE) === '#101010'
          ? true
          : `${named} / ${swatchLabel(p, 1, DEFAULT_PALETTE)}`
      })

      check('newSong can be seeded with a team default', () => {
        const seeded = newSong(1, {
          palette: defaultPalette().map(() => '#111111'),
          highlightPalette: DEFAULT_HIGHLIGHTS.map(() => '#222222'),
        })
        // and must copy, not alias, so editing one song cannot affect another
        const other = newSong(1)
        seeded.palette[0] = '#333333'
        return seeded.palette[1] === '#111111' &&
          seeded.highlightPalette[0] === '#222222' &&
          other.palette[0] === DEFAULT_PALETTE[0].fill
          ? true
          : 'seeding leaked'
      })

      /* ---- beat width ---- */

      check('beat width drives the bar width', () => {
        const s = newSong(1)
        s.beatWidth = 300
        const l = computeLayout(s, 1)
        return l.barWidth === 300 * s.beatsPerBar ? true : l.barWidth
      })

      check('wider beats give every syllable more room', () => {
        const narrow = newSong(1)
        const wide = newSong(1)
        wide.beatWidth = MAX_BEAT_WIDTH
        const a = computeLayout(narrow, 1).bars[0].slots[0].cell
        const b = computeLayout(wide, 1).bars[0].slots[0].cell
        return b > a ? true : `${a} -> ${b}`
      })

      check('beat width round trips and is clamped on load', () => {
        const s = newSong(1)
        s.beatWidth = 260
        const raw = JSON.parse(JSON.stringify(s))
        return coerceSong(raw).beatWidth === 260 &&
          coerceSong({ ...raw, beatWidth: 99999 }).beatWidth === MAX_BEAT_WIDTH &&
          coerceSong({ ...raw, beatWidth: 2 }).beatWidth === MIN_BEAT_WIDTH &&
          coerceSong({ ...raw, beatWidth: undefined }).beatWidth === 170
          ? true
          : 'not clamped'
      })

      /* ---- stroke weights ---- */

      check('the measure line is thicker than the heaviest notch', () => {
        const m = computeLayout(newSong(1), 1).m
        return m.baselineW > Math.max(...m.notchW)
          ? true
          : `baseline ${m.baselineW} vs notch ${Math.max(...m.notchW)}`
      })

      check('the measure line covers the whole width of the beat-1 notch', () => {
        // The notch is centred on x0, so a line starting at x0 leaves half of
        // that stroke hanging past its end.
        const l = computeLayout(newSong(1), 1)
        const row = l.bars[0]
        return Math.abs(row.lineX0 - (row.x0 - l.m.notchW[0] / 2)) < 0.001 &&
          row.lineX0 < row.slots[0].x
          ? true
          : `line starts ${row.lineX0}, notch centre ${row.x0}`
      })

      check('the bar number matches the beat number in size', () => {
        const m = computeLayout(newSong(1), 1).m
        return m.labelSize === m.rulerSize ? true : `${m.labelSize} vs ${m.rulerSize}`
      })

      check('subdivision notches are light', () => {
        const m = computeLayout(newSong(1), 1).m
        // level 2 (the 16ths you see at division 4) and level 3 (32nds)
        return m.notchW[2] <= 1.1 && m.notchW[3] < m.notchW[2]
          ? true
          : `l2 ${m.notchW[2]} l3 ${m.notchW[3]}`
      })

      check('the minimum-width floor does not flatten the ramp at 100%', () => {
        // A floor set too high silently clamps the lightest levels together.
        const m = computeLayout(newSong(1), 1).m
        return eq(m.notchW, [1.9, 1.45, 1, 0.8])
      })

      check('notch weight falls strictly with level', () => {
        // Two levels at the same weight would flatten the hierarchy — the beat
        // and the "&" would read alike.
        const m = computeLayout(newSong(1), 1).m
        return m.notchW.every((w, i) => i === 0 || w < m.notchW[i - 1])
          ? true
          : JSON.stringify(m.notchW)
      })

      /* ---- vertical padding ---- */

      check('beat vertical padding drives the row pitch', () => {
        const a = newSong(2)
        const b = newSong(2)
        b.rowGap = 100
        const la = computeLayout(a, 1)
        const lb = computeLayout(b, 1)
        return Math.abs(lb.rowPitch - la.rowPitch - (100 - a.rowGap)) < 0.001
          ? true
          : `${la.rowPitch} -> ${lb.rowPitch}`
      })

      check('zero padding is allowed and puts bars flush', () => {
        const s = newSong(2)
        s.rowGap = 0
        const l = computeLayout(s, 1)
        return Math.abs(l.bars[1].top - l.bars[0].bottom) < 0.001 ? true : 'not flush'
      })

      /* ---- phrase highlight band ---- */

      check('the row block holds equal air above and below its ink', () => {
        // A phrase highlight fills the row block, so any asymmetry here shows up
        // as a slab of colour on one side of the marks — it used to run far past
        // the lyrics. Equal air is what makes the highlight read as centred.
        for (const size of [MIN_LYRIC_SIZE, 15, MAX_LYRIC_SIZE]) {
          const s = newSong(1)
          s.lyricSize = size
          const l = computeLayout(s, 1)
          const r = l.bars[0]
          const m = l.m
          const inkTop = r.y - Math.max(m.notchH[0], m.rLarge + m.circleStroke)
          const inkBottom = r.textY + m.textSize * 0.26 // descender, per layout.ts
          const above = inkTop - r.top
          const below = r.bottom - inkBottom
          if (Math.abs(above - below) > 0.001) return `at ${size}: above ${above}, below ${below}`
        }
        return true
      })

      check('the row block covers every mark it sits behind', () => {
        for (const size of [MIN_LYRIC_SIZE, 15, MAX_LYRIC_SIZE]) {
          const s = newSong(1)
          s.lyricSize = size
          const l = computeLayout(s, 1)
          const r = l.bars[0]
          if (r.top > r.y - l.m.notchH[0]) return `clips the beat notch at ${size}`
          if (r.top > r.y - l.m.rLarge) return `clips a large circle at ${size}`
          if (r.bottom < r.textY) return `clips the lyric at ${size}`
        }
        return true
      })

      check('phrase highlights meet flush across bars at zero padding', () => {
        // A bar-spanning highlight is one rect per row; a gap between the rows
        // would break it into stripes.
        for (const size of [MIN_LYRIC_SIZE, 15, MAX_LYRIC_SIZE]) {
          const s = newSong(3)
          s.lyricSize = size
          s.rowGap = 0
          const l = computeLayout(s, 1)
          for (let i = 1; i < l.bars.length; i++) {
            const gap = l.bars[i].top - l.bars[i - 1].bottom
            if (Math.abs(gap) > 0.001) return `gap of ${gap} at ${size}`
          }
        }
        return true
      })

      check('padding round trips and is clamped on load', () => {
        const s = newSong(1)
        s.rowGap = 44
        const raw = JSON.parse(JSON.stringify(s))
        return coerceSong(raw).rowGap === 44 &&
          coerceSong({ ...raw, rowGap: -5 }).rowGap === MIN_ROW_GAP &&
          coerceSong({ ...raw, rowGap: 9999 }).rowGap === MAX_ROW_GAP &&
          coerceSong({ ...raw, rowGap: undefined }).rowGap === DEFAULT_ROW_GAP
          ? true
          : 'not clamped'
      })

      check('new songs default to no vertical padding', () => {
        // Bars sit flush unless the user asks for air, so a fresh song is dense.
        const s = newSong(2)
        if (s.rowGap !== 0) return `rowGap ${s.rowGap}`
        const l = computeLayout(s, 1)
        return Math.abs(l.bars[1].top - l.bars[0].bottom) < 0.001 ? true : 'not flush'
      })

      /* ---- ruler label toggle ---- */

      check('the “beat” label defaults on and survives a round trip', () => {
        const s = newSong(1)
        s.rulerLabel = false
        const raw = JSON.parse(JSON.stringify(s))
        return coerceSong(raw).rulerLabel === false &&
          coerceSong({ ...raw, rulerLabel: undefined }).rulerLabel === true
          ? true
          : 'toggle lost'
      })

      /* ---- notch levels match the spec ---- */

      check('div 4 = beat, small, medium, small', () => eq(NOTCH_LEVELS[4], [0, 2, 1, 2]))
      check('div 3 = beat, small, small', () => eq(NOTCH_LEVELS[3], [0, 2, 2]))
      check('div 6 = beat, small, small, medium, small, small', () => eq(NOTCH_LEVELS[6], [0, 2, 2, 1, 2, 2]))
      check('div 8 halves down three levels', () => eq(NOTCH_LEVELS[8], [0, 3, 2, 3, 1, 3, 2, 3]))
      check('notch height falls with level', () => {
        const l = computeLayout(newSong(1), 1)
        const h = l.m.notchH, w = l.m.notchW
        return h[0] > h[1] && h[1] > h[2] && h[2] > h[3] && w[0] > w[1] && w[1] > w[2] && w[2] > w[3]
          ? true
          : 'not monotonic'
      })

      /* ---- compound divisions: a beat whose halves differ ---- */

      const ats = (d) => beatSubdivisions(d).map((s) => s.at)
      const levels = (d) => beatSubdivisions(d).map((s) => s.level)

      check('a uniform division is evenly spaced at its own levels', () =>
        eq(ats(4), [0, 0.25, 0.5, 0.75]) === true && eq(levels(4), NOTCH_LEVELS[4]) === true
          ? true
          : 'uniform table changed')

      check('3+2 is a triplet then two 16ths', () =>
        eq(ats('3+2'), [0, 1 / 6, 2 / 6, 0.5, 0.75]))

      check('2+3 is two 16ths then a triplet', () =>
        eq(ats('2+3'), [0, 0.25, 0.5, 0.5 + 1 / 6, 0.5 + 2 / 6]))

      check('each half of a compound is spaced like the even division it would be', () =>
        COMPOUND_DIVISIONS.every((d) => {
          const [a, b] = d.split('+').map(Number)
          const got = ats(d)
          const want = [
            ...ats(a * 2).slice(0, a),
            ...ats(b * 2).slice(b),
          ]
          return want.every((v, i) => Math.abs(got[i] - v) < 1e-9)
        }) ? true : 'a half does not match its even division')

      // The levels are what make the grid readable, and they are read out of
      // the even division each half would be — so the beat stays tallest and
      // the middle notch keeps the level that marks the half of the beat.
      check('a compound keeps the beat and the half-beat notch weights', () =>
        COMPOUND_DIVISIONS.every((d) => {
          const l = levels(d)
          const half = beatSubdivisions(d).findIndex((s) => s.at === 0.5)
          return l[0] === 0 && half > 0 && l[half] === 1
        }) ? true : 'beat or half-beat level lost')

      check('3+4 levels come from divisions 6 and 8', () =>
        eq(levels('3+4'), [0, 2, 2, 1, 3, 2, 3]))

      check('subCount counts notches, not the label', () =>
        subCount('3+2') === 5 && subCount('3+4') === 7 && subCount(6) === 6
          ? true
          : `${subCount('3+2')} ${subCount('3+4')}`)

      check('widths of one beat sum to the beat', () =>
        COMPOUND_DIVISIONS.every(
          (d) => Math.abs(beatSubdivisions(d).reduce((t, s) => t + s.width, 0) - 1) < 1e-9,
        ) ? true : 'widths do not fill the beat')

      // The rule behind re-dividing a beat: a position survives only where the
      // new grid has a notch at the same instant.
      check('subAtFraction keeps positions that line up and rejects the rest', () => {
        if (subAtFraction(8, 0.5) !== 4) return 'the 8th did not survive 4 -> 8'
        if (subAtFraction(3, 0.25) !== -1) return 'a 16th survived 4 -> 3'
        // Second half of "3+2" is straight 16ths, so the 4-grid's 0.75 lives on.
        if (subAtFraction('3+2', 0.75) !== 4) return '0.75 lost going to 3+2'
        // The first half is a triplet, so the 4-grid's 0.25 has nowhere to go.
        if (subAtFraction('3+2', 0.25) !== -1) return '0.25 survived into a triplet'
        return true
      })

      check('a compound division round-trips through coerceSong', () => {
        const s = newSong(1)
        s.bars[0].divisions = ['3+2', 4, '4+3', 2]
        s.bars[0].slots[slotKey(0, 4)] = { text: 'e', circle: 'small' }
        const back = coerceSong(JSON.parse(JSON.stringify(s)))
        return eq(back.bars[0].divisions, ['3+2', 4, '4+3', 2]) === true &&
          back.bars[0].slots[slotKey(0, 4)]?.text === 'e'
          ? true
          : 'compound lost'
      })

      check('an unknown division is repaired, not kept', () => {
        const s = newSong(1)
        const raw = JSON.parse(JSON.stringify(s))
        raw.bars[0].divisions = ['5+7', 4, 4, 4]
        return coerceSong(raw).bars[0].divisions[0] === 4 ? true : 'kept a bad division'
      })

      check('a slot past the end of a compound beat is dropped on load', () => {
        const s = newSong(1)
        const raw = JSON.parse(JSON.stringify(s))
        raw.bars[0].divisions = ['3+2', 4, 4, 4]
        // 5 notches, so 4 is the last legal sub.
        raw.bars[0].slots = { '0:4': { text: 'in' }, '0:5': { text: 'out' } }
        const slots = coerceSong(raw).bars[0].slots
        return slots['0:4'] && !slots['0:5'] ? true : eq(Object.keys(slots), ['0:4'])
      })

      check('parseDivision takes both spellings and falls back otherwise', () =>
        parseDivision('3+2') === '3+2' && parseDivision('8') === 8 && parseDivision('nope', 3) === 3
          ? true
          : 'parse wrong')

      check('slot count follows a compound division', () => {
        const s = newSong(1)
        s.bars[0].divisions = ['3+2', '3+4', 4, 4]
        return allSlotRefs(s).length === 5 + 7 + 4 + 4 ? true : allSlotRefs(s).length
      })

      check('a compound beat lays out with uneven cells that still tile it', () => {
        const s = newSong(1)
        s.bars[0].divisions = ['3+2', 4, 4, 4]
        const row = computeLayout(s, 1).bars[0]
        const beat = row.slots.filter((p) => p.beat === 0)
        const per = computeLayout(s, 1).m.pxPerBeat
        const first = beat[0].cell
        const last = beat[4].cell
        // Triplet 16ths on the first half, straight 16ths on the second, and
        // the two halves still add up to exactly one beat.
        return Math.abs(first - per / 6) < 1e-9 &&
          Math.abs(last - per / 4) < 1e-9 &&
          Math.abs(beat.reduce((t, p) => t + p.cell, 0) - per) < 1e-9
          ? true
          : `${first} ${last}`
      })

      // The grab zone is the whole reason a wide slot next to a narrow one is
      // still clickable: half a cell each way would reach past its neighbour.
      check('grab zones tile the row without overlapping', () => {
        const s = newSong(1)
        s.bars[0].divisions = ['3+2', 3, 8, 4]
        const row = computeLayout(s, 1).bars[0]
        for (let i = 1; i < row.slots.length; i++) {
          const a = row.slots[i - 1], b = row.slots[i]
          if (Math.abs(a.hitX1 - b.hitX0) > 1e-9) return `gap at ${i}`
          if (a.hitX1 <= a.x || b.hitX0 >= b.x) return `zone misses its notch at ${i}`
        }
        return true
      })

      check('an evenly divided beat grabs exactly half a cell each way', () => {
        const row = computeLayout(newSong(1), 1).bars[0]
        return row.slots.every(
          (p) =>
            Math.abs(p.hitX0 - (p.x - p.cell / 2)) < 1e-9 &&
            Math.abs(p.hitX1 - (p.x + p.cell / 2)) < 1e-9,
        ) ? true : 'uniform grab zone moved'
      })

      /* ---- layout ---- */

      check('slot count follows per-beat divisions', () => {
        const s = newSong(1)
        s.bars[0].divisions = [4, 3, 6, 8]
        return allSlotRefs(s).length === 21 ? true : allSlotRefs(s).length
      })

      check('bars never wrap: width is one bar wide', () => {
        const s = newSong(5)
        const l = computeLayout(s, 1)
        return l.bars.every((b) => b.x1 - b.x0 === l.barWidth) ? true : 'bar widths differ'
      })

      check('zoom scales layout linearly', () => {
        const s = newSong(2)
        const a = computeLayout(s, 1)
        const b = computeLayout(s, 2)
        return Math.abs(b.barWidth - a.barWidth * 2) < 0.001 ? true : 'barWidth not linear'
      })

      check('bar labels start at startBar', () => {
        const s = newSong(3)
        s.startBar = 0
        return eq(computeLayout(s, 1).bars.map((b) => b.label), [0, 1, 2])
      })

      check('beat edges bracket every beat', () => {
        const l = computeLayout(newSong(1), 1)
        const e = l.bars[0].beatEdges
        return e.length === 5 && e[0] === l.bars[0].x0 && e[4] === l.bars[0].x1 ? true : JSON.stringify(e)
      })

      check('makeBar respects beatsPerBar', () => makeBar(7, 6).divisions.length === 7 || 'wrong length')

      check('no notch is drawn at the end of a bar', () => {
        // The last slot sits one cell short of the bar end; that position is
        // beat 1 of the next bar and must not be notched twice.
        const l = computeLayout(newSong(1), 1)
        const row = l.bars[0]
        const last = row.slots[row.slots.length - 1]
        return row.slots.every((p) => p.x < row.x1) && Math.abs(last.x + last.cell - row.x1) < 0.001
          ? true
          : `last notch at ${last.x}, bar ends ${row.x1}`
      })

      check('the bar label is centred on the beat notch it belongs to', () => {
        const l = computeLayout(newSong(2), 1)
        return l.bars.every((r) => {
          // the beat notch runs from the baseline up by notchH[0]
          const notchMiddle = r.y - l.m.notchH[0] / 2
          return Math.abs(r.labelY - l.m.labelSize * 0.36 - notchMiddle) < 0.001
        })
          ? true
          : 'label not centred on the notch'
      })

      check('the bar label sits out in the gutter, clear of beat 1', () => {
        // End-anchored, so labelX is the number's right edge: it has to leave
        // real space before the bar starts and still land inside the gutter.
        const l = computeLayout(newSong(2), 1)
        const r = l.bars[0]
        const gap = l.x0 - r.labelX
        return gap >= l.m.gutter * 0.3 && r.labelX > l.m.padX
          ? true
          : `labelX ${r.labelX}, gap ${gap}, gutter ${l.m.gutter}`
      })

      check('the label stays on the notch when lyrics get taller', () => {
        // It must not drift with the text zone, which grows below the baseline.
        const s = newSong(1)
        s.lyricSize = MAX_LYRIC_SIZE
        const l = computeLayout(s, 1)
        const r = l.bars[0]
        return Math.abs(r.labelY - l.m.labelSize * 0.36 - (r.y - l.m.notchH[0] / 2)) < 0.001
          ? true
          : 'label drifted'
      })

      /* ---- lyric size ---- */

      check('lyric size drives the rendered text size', () => {
        const s = newSong(1)
        s.lyricSize = 28
        return computeLayout(s, 1).m.textSize === 28 ? true : computeLayout(s, 1).m.textSize
      })

      check('lyric size scales with zoom', () => {
        const s = newSong(1)
        s.lyricSize = 20
        return computeLayout(s, 2).m.textSize === 40 ? true : 'not scaled'
      })

      check('bigger lyrics make the row taller so bars cannot collide', () => {
        const small = newSong(2)
        const big = newSong(2)
        big.lyricSize = MAX_LYRIC_SIZE
        const a = computeLayout(small, 1)
        const b = computeLayout(big, 1)
        return b.rowPitch > a.rowPitch && b.bars[1].top >= b.bars[0].bottom
          ? true
          : `pitch ${a.rowPitch} -> ${b.rowPitch}`
      })

      check('lyric text clears a large circle at any size', () => {
        for (const size of [MIN_LYRIC_SIZE, 15, MAX_LYRIC_SIZE]) {
          const s = newSong(1)
          s.lyricSize = size
          const l = computeLayout(s, 1)
          const row = l.bars[0]
          // text cap-height top must sit below the circle's lower edge
          if (row.textY - l.m.textSize * 0.72 < row.y + l.m.rLarge) return `collides at ${size}`
        }
        return true
      })

      check('lyric size round trips and is clamped on load', () => {
        const s = newSong(1)
        s.lyricSize = 22
        if (coerceSong(JSON.parse(JSON.stringify(s))).lyricSize !== 22) return 'lost on round trip'
        const raw = JSON.parse(JSON.stringify(s))
        return [
          coerceSong({ ...raw, lyricSize: 9999 }).lyricSize === MAX_LYRIC_SIZE,
          coerceSong({ ...raw, lyricSize: 1 }).lyricSize === MIN_LYRIC_SIZE,
          coerceSong({ ...raw, lyricSize: 'huge' }).lyricSize === 15,
          coerceSong({ ...raw, lyricSize: undefined }).lyricSize === 15,
        ].every(Boolean)
          ? true
          : 'not clamped'
      })

      /* ---- caption ---- */

      check('caption renders in reference order', () =>
        headerLine({ verse: 'Verse 2', title: 'Song Title', artist: 'Artist', year: '1994', timestamp: '1:04' }) ===
          'Verse 2, “Song Title,” Artist (1994), 1:04' || headerLine({ verse: 'Verse 2', title: 'Song Title', artist: 'Artist', year: '1994', timestamp: '1:04' }))

      check('caption omits blank fields', () =>
        headerLine({ verse: '', title: 'X', artist: '', year: '', timestamp: '' }) === '“X,”' ||
        headerLine({ verse: '', title: 'X', artist: '', year: '', timestamp: '' }))

      const summary = document.createElement('h1')
      summary.className = failures ? 'fail' : 'pass'
      summary.textContent = failures ? `${failures} FAILED` : 'all checks passed'
      out.prepend(summary)
    </script>
  </body>
</html>
